# Configuration de la génération synthétique V3 (corner-based)
seed: 42

assets:
  card_templates_dir: data/card_templates      # 54 templates 200x300 BGR
  train_images_dir: data/train_images          # source des fonds
  yolo_annotations_dir: data/yolo_annotations  # bboxes pour masquer les cartes
  out_cards_dir: data/synthetic/cards          # cartes RGBA propres
  out_bg_dir: data/synthetic/backgrounds       # white/ et noisy/
  card_corner_radius_frac: 0.07                # arrondi des coins UNO
  bg_patch_size: 256
  bg_patches_per_image: 6
  bg_white_v_threshold: 170                    # médiane V > seuil => fond blanc

scene:
  out_images_dir: data/synthetic/images
  out_labels_dir: data/synthetic/labels
  n_scenes: 5000
  width: 1024
  height: 768
  cards_min: 4
  cards_max: 13
  rotation_deg: 20                # ±20°
  card_width_px: [90, 150]        # largeur carte dans la scène (échantillonnée)
  stack_prob: 0.35                # proba qu'une zone ait un empilement
  stack_size: [2, 3]              # cartes par pile
  stack_offset_px: [30, 50]       # décalage diagonal
  shadow_offset_px: 4
  shadow_blur: 7
  shadow_opacity: 0.35
  occlusion_visibility_thresh: 0.55  # coin visible si <55% recouvert
  # zones (relatif [0,1]) — cohérent avec src/v3/zone_definition.py
  zones:
    p1: [0.25, 0.70, 0.75, 1.00]   # x0,y0,x1,y1 (bottom)
    p2: [0.70, 0.20, 1.00, 0.80]   # right
    p3: [0.25, 0.00, 0.75, 0.30]   # top
    p4: [0.00, 0.20, 0.30, 0.80]   # left
    center: [0.35, 0.35, 0.65, 0.65]
